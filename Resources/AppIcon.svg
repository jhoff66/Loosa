<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ccd6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#9ea3b3" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="0.5" stop-color="#9a4dff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <clipPath id="tile"><rect x="196" y="196" width="632" height="632" rx="128"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b0b4a" flood-opacity=".45"/></filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a0a30" flood-opacity=".35"/></filter>
  </defs>

  <!-- moldura clara -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#frame)" filter="url(#tileShadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="188" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- miolo colorido -->
  <g filter="url(#inner)">
    <rect x="196" y="196" width="632" height="632" rx="128" fill="url(#base)"/>
  </g>
  <g clip-path="url(#tile)">
    <g filter="url(#blur)">
      <circle cx="270" cy="270" r="190" fill="#ff7ac8"/>
      <circle cx="760" cy="250" r="170" fill="#3fa9ff"/>
      <circle cx="250" cy="800" r="200" fill="#ff9a3d"/>
      <circle cx="800" cy="800" r="170" fill="#7a4dff"/>
      <circle cx="560" cy="520" r="130" fill="#ff4fa3" opacity=".8"/>
      <circle cx="430" cy="360" r="90" fill="#ffd94a" opacity=".7"/>
    </g>
    <!-- brilho -->
    <ellipse cx="512" cy="230" rx="360" ry="120" fill="#fff" opacity=".18"/>
  </g>

  <!-- traço branco -->
  <g filter="url(#drop)">
    <g transform="translate(155 206) scale(34)">
      <path d="M5 10C6.8 5.6 9 5.6 10.5 9C12 12.4 14.2 12.4 16 8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
