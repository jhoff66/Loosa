<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ccd6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#9ea3b3" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b22"/>
      <stop offset="1" stop-color="#0c0d0c"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="750" y2="0">
      <stop offset="0" stop-color="#b7f34a"/>
      <stop offset=".24" stop-color="#2fe3b4"/>
      <stop offset=".46" stop-color="#4f9dff"/>
      <stop offset=".66" stop-color="#8a5cff"/>
      <stop offset=".86" stop-color="#ff5fb0"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f1f2f6"/>
      <stop offset="1" stop-color="#b9bdca"/>
    </linearGradient>
    <linearGradient id="penCone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4f5c"/>
      <stop offset="1" stop-color="#1c1f26"/>
    </linearGradient>
    <clipPath id="tile"><rect x="196" y="196" width="632" height="632" rx="128"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="gloss" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#05060a" flood-opacity=".42"/></filter>
    <filter id="penDrop" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feDropShadow dx="-10" dy="18" stdDeviation="14" flood-color="#05060a" flood-opacity=".45"/></filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a0a30" flood-opacity=".35"/></filter>
  </defs>

  <!-- moldura clara -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#frame)" filter="url(#tileShadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="188" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- miolo escuro -->
  <g filter="url(#inner)">
    <rect x="196" y="196" width="632" height="632" rx="128" fill="url(#tileFill)"/>
  </g>
  <g clip-path="url(#tile)">
    <g filter="url(#blur)" opacity=".55">
      <circle cx="250" cy="640" r="150" fill="#7fd13a"/>
      <circle cx="560" cy="430" r="140" fill="#5a4dff"/>
      <circle cx="790" cy="560" r="130" fill="#ff4fa3"/>
    </g>
    <!-- brilho -->
    <ellipse cx="512" cy="216" rx="360" ry="96" fill="#fff" opacity=".07"/>
  </g>

  <!-- traço: sai da moldura e termina na ponta da caneta -->
  <g filter="url(#drop)">
    <path d="M184 562C266.800 359.600 368 359.600 437 516C506 672.400 607.200 672.400 690 470" fill="none" stroke="url(#ink)" stroke-width="106" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M184 562C266.800 359.600 368 359.600 437 516C506 672.400 607.200 672.400 690 470" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -24)" filter="url(#gloss)"/>
  </g>

  <!-- caneta -->
  <g filter="url(#penDrop)">
    <g transform="translate(690 470) rotate(35)">
      <rect x="-31" y="-318" width="62" height="250" rx="31" fill="url(#penBody)"/>
      <rect x="-31" y="-118" width="62" height="50" fill="url(#penBody)"/>
      <rect x="-31" y="-104" width="62" height="12" fill="#9aa0b0" opacity=".55"/>
      <path d="M-31 -68H31L7 -6Q0 6 -7 -6Z" fill="url(#penCone)"/>
      <path d="M-11.500 -18H11.500L7 -6Q0 6 -7 -6Z" fill="#ff9a3d"/>
      <rect x="-21" y="-300" width="9" height="196" rx="4.500" fill="#fff" opacity=".9"/>
    </g>
  </g>
</svg>
